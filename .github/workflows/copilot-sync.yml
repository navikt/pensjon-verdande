name: Copilot Customization Sync
on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

concurrency:
   group: copilot-customization-sync
   cancel-in-progress: true

jobs:
  sync:
    uses: navikt/copilot/.github/workflows/copilot-customization-sync.yml@main
    permissions:
      contents: write
      pull-requests: write
