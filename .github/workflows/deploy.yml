name: Build and deploy

permissions:
  contents: read

# main deployer til prod, q0 og q5.
# q1 og q2 følger sandbox-branchen — se sandbox.yml.
on:
  push:
    branches:
      - main

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    permissions:
      contents: read
      id-token: write
    secrets: inherit
    uses: ./.github/workflows/build.yml

  deploy:
    needs: [ci, build]

    runs-on: 'ubuntu-latest'

    permissions:
      contents: "read"
      id-token: "write"

    concurrency: deploy-${{ matrix.name }}

    strategy:
      matrix:
        include:
          - name: pensjon-verdande
            cluster: prod-gcp
            vars: .nais/vars-prod.yaml

          - name: pensjon-verdande-q0
            cluster: dev-gcp
            vars: .nais/vars-dev-q0.yaml

          - name: pensjon-verdande-q5
            cluster: dev-gcp
            vars: .nais/vars-dev-q5.yaml

    steps:
      # Sikkerhetsgjerde: prod skal aldri kunne deployes fra en annen branch enn main.
      - name: 'Verifiser at prod kun deployes fra main'
        if: matrix.cluster == 'prod-gcp' && github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::Deploy til prod-gcp er kun tillatt fra main, men ref er $REF"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nais/deploy/actions/deploy@fc3eae3edebabdf67f7592102ae16176d5ba3b5f # v2
        name: 'Deploy to NAIS'
        env:
          IMAGE: "${{ needs.build.outputs.image }}"
          RESOURCE: .nais/nais.yaml
          CLUSTER: '${{ matrix.cluster }}'
          VARS: ${{matrix.vars}}

  deployPages:
    needs: [ci]

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: 'pages'
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sett opp og installer frontend avhengigheter
        uses: ./.github/actions/setup-frontend

      - name: Build Storybook
        run: pnpm run typecheck && pnpm run build && pnpm run build-storybook

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: 'storybook-static'
          overwrite: true

      - id: deploy
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          token: ${{ github.token }}
