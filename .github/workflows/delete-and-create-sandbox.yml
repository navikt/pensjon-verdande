name: Delete and create new sandbox branch

permissions:
  contents: read

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: sandbox-branch
  cancel-in-progress: false

jobs:
  createNewSandbox:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Slett sandbox-branchen
        uses: dawidd6/action-delete-branch@d1efac9a6f7a9b408d4e8ff663a99c1fbac17b3f # v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branches: sandbox
          soft_fail: true

      - name: Legg til SANDBOX.md
        shell: bash
        run: |
          cat > .github/SANDBOX.md <<'MARKDOWN'
          # SANDBOX

          Denne filen tilhører `sandbox`-branchen.

          Ikke flytt eller slett den. Den brukes til å oppdage om endringer fra
          `sandbox`-branchen har blitt merget inn i en annen branch, slik at
          sandbox-commits ikke havner på `main`.

          Se `.github/workflows/prevent-sandbox-commits.yml`.
          MARKDOWN

      - name: Opprett sandbox-branchen på nytt med SANDBOX.md
        uses: EndBug/add-and-commit@a94899bca583c204427a224a7af87c02f9b325d5 # v9
        with:
          new_branch: sandbox
          message: 'Opprettet SANDBOX.md'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push til sandbox
        run: git push origin HEAD:sandbox
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploySandbox:
    needs: createNewSandbox
    permissions:
      contents: read
      id-token: write
    secrets: inherit
    uses: ./.github/workflows/sandbox.yml
    with:
      sandbox: true
